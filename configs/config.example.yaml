# 复制为 configs/config.yaml 后修改；不要将含真实密钥的文件提交到仓库。
#
# --- 本地链（Anvil）常用值 ---
#   http_rpc: "http://127.0.0.1:8545"
#   ws_rpc:   "ws://127.0.0.1:8545"
#   chain_id: 31337
#
server:
  gin_mode: "debug" # release | debug
  http_addr: ":8080"
  grpc_addr: ":9090"
  # 可选：对外根 URL（无尾斜杠），上传响应里 download_url 用其拼接；留空则按请求 Host 推断。
  # public_base_url: "https://api.example.com"

jwt:
  secret: "please-change-me-use-long-random-string"
  expire_hours: 72

# 内存演示用户（生产环境请对接数据库与密码哈希）。
users:
  - username: "admin"
    password: "admin123"
  - username: "demo"
    password: "demo123"

eth:
  # 与节点返回的 chain id 校验用；Anvil 默认 31337。
  chain_id: 31337
  http_rpc: "http://127.0.0.1:8545"
  # 订阅新区块 / 日志需要 WebSocket；仅 HTTP 时程序会跳过订阅并打日志提示。
  ws_rpc: "ws://127.0.0.1:8545"
  # 可选：部署在本地的 ERC-20 合约地址，用于监听 Transfer。留空则只订阅区块头。
  erc20_contract: ""
  # 仅本地链（Anvil）：true 时允许 JWT 用户调用 POST /api/v1/tools/send-eth 用私钥转原生币。
  # 切勿在主网或共享环境开启；不要在请求里对生产钱包使用此接口。
  dev_send_enabled: false

listener:
  # 生产者->Channel->消费者 worker 数量（演示并发模型）。
  worker_count: 3
  channel_buffer: 32
  # 订阅断线后重连等待下限（指数退避在此基础上翻倍，封顶 30s）。
  reconnect_base_ms: 500

files:
  upload_dir: "./data/uploads"

mysql:
  # 链下索引库；连接失败时 indexer 自动关闭，HTTP/gRPC 仍可运行。
  enabled: true
  admin_dsn: "root:123456@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
  dsn: "root:123456@tcp(127.0.0.1:3306)/chain_indexer?parseTime=true&multiStatements=true"
  max_open: 25
  max_idle: 10

redis:
  # 未安装 Redis 时会自动降级为进程内内存缓存（代码演示）。
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

indexer:
  enabled: true
  confirm_depth: 2      # 确认深度：落后链尖 N 块后标记 confirmed（reorg 安全）
  batch_size: 20        # 回填每批最多块数
  outbox_workers: 2     # Outbox→Redis 并发消费者
  max_retries: 5
  gap_scan_interval_sec: 15   # 漏块检测周期（秒）
  hash_verify_window: 64      # 与链上 hash 对账的窗口大小
  watch_contracts: []
  # 示例：监听自定义合约
  # watch_contracts:
  #   - address: "0xYourContract"
  #     abi: "abis/erc20.json"
  #     events: ["Transfer", "Approval"]

tx_tracker:
  # 广播后的 tx 状态轮询（需 mysql.enabled=true）；落库表 tx_tracker。
  enabled: true
  poll_interval_sec: 3
  confirm_depth: 2
  batch_size: 50
  max_pending_hours: 24
  use_eip1559: true              # 托管发交易时使用 EIP-1559 DynamicFeeTx
  speed_up_gas_bump_percent: 20  # RBF 加速时 gas 上浮比例
  outbox_workers: 2              # 状态变更通知消费者（Webhook/Kafka 扩展位）
  require_idempotency_key: true  # 生产建议 true：强制客户端带 Idempotency-Key
  reconcile_interval_sec: 10     # 对 submitting/broadcast_failed 重试广播
  reconcile_grace_sec: 5         # 新建 submitting 记录后等待秒数再 reconcile
  broadcast_max_retries: 5

balance_sync:
  # 托管/交易所：仅同步 custodial_wallets 中注册的地址到 account_balances。
  enabled: true
  custodial_only: true
  on_tx_confirmed: true   # 本系统发出交易确认后刷新
  on_indexer_tx: true     # Indexer 扫块时刷新（捕获外部充值）
  stale_sec: 60           # API auto 模式快照过期秒数
  backfill_interval_sec: 300
  watch_tokens: []        # 额外 ERC-20 合约；eth.erc20_contract 会自动加入

exchange:
  # 交易所业务层：链下账本 + 充值确认入账 + 提现审核 + 对账
  enabled: true
  deposit_enabled: true
  confirm_depth: 0          # 0 = 沿用 indexer.confirm_depth
  auto_approve_withdraw: false
  hot_withdraw_max_wei: "1000000000000000000"  # 1 ETH 以下走热钱包
  reconcile_interval_sec: 300
  signer:
    type: "dev"             # dev | kms | hsm | mpc
    dev_private_key: ""     # 本地 Anvil 热钱包私钥（切勿提交仓库）
