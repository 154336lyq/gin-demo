# 默认本地开发配置（与 config.example.yaml 相同）。
# 启动 Anvil 后可直接运行 chain-backend；请勿把真实密钥写入仓库。
server:
  gin_mode: "debug"
  http_addr: ":8080"
  grpc_addr: ":9090"
  # 上传接口返回的 download_url 前缀；与浏览器/网关访问地址一致即可，便于直接存库。
  public_base_url: "http://127.0.0.1:8080"

jwt:
  secret: "local-dev-only-change-for-production"
  expire_hours: 72

users:
  - username: "admin"
    password: "admin123"
  - username: "demo"
    password: "demo123"

eth:
  chain_id: 31337
  http_rpc: "http://127.0.0.1:8545"
  ws_rpc: "ws://127.0.0.1:8545"
  erc20_contract: ""

listener:
  worker_count: 3
  channel_buffer: 32
  reconnect_base_ms: 500

files:
  upload_dir: "./data/uploads"

mysql:
  enabled: true
  admin_dsn: "root:123456@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
  dsn: "root:123456@tcp(127.0.0.1:3306)/chain_indexer?parseTime=true&multiStatements=true"
  max_open: 25
  max_idle: 10

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

indexer:
  enabled: true
  confirm_depth: 2
  batch_size: 20
  outbox_workers: 2
  max_retries: 5
  gap_scan_interval_sec: 15
  hash_verify_window: 64
  # 通用事件监听；eth.erc20_contract 非空时会自动追加 Transfer/Approval
  watch_contracts: []
