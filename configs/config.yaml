# 默认本地开发配置（与 config.example.yaml 相同）。
# 启动 Anvil 后可直接运行 chain-backend；请勿把真实密钥写入仓库。
server:
  gin_mode: "debug"
  http_addr: ":8080"
  grpc_addr: ":9090"
  # 上传接口返回的 download_url 前缀；与浏览器/网关访问地址一致即可，便于直接存库。
  public_base_url: "http://127.0.0.1:8080"

jwt:
  secret: "local-dev-only-change-for-production"
  expire_hours: 72

users:
  - username: "admin"
    password: "admin123"
  - username: "demo"
    password: "demo123"

eth:
  chain_id: 31337
  http_rpc: "http://127.0.0.1:8545"
  ws_rpc: "ws://127.0.0.1:8545"
  erc20_contract: ""
  # 仅本地 Anvil：开启后允许 POST /api/v1/tx/send 与 /tools/send-eth
  dev_send_enabled: true

listener:
  worker_count: 3
  channel_buffer: 32
  reconnect_base_ms: 500

files:
  upload_dir: "./data/uploads"

mysql:
  enabled: true
  admin_dsn: "root:123456@tcp(127.0.0.1:3306)/?parseTime=true&multiStatements=true"
  dsn: "root:123456@tcp(127.0.0.1:3306)/chain_indexer?parseTime=true&multiStatements=true"
  max_open: 25
  max_idle: 10

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  password: ""
  db: 0

indexer:
  enabled: true
  confirm_depth: 2
  batch_size: 20
  outbox_workers: 2
  max_retries: 5
  gap_scan_interval_sec: 15
  hash_verify_window: 64
  # eth.erc20_contract 非空时会自动追加 Transfer/Approval
  watch_contracts: []

tx_tracker:
  enabled: true
  poll_interval_sec: 3
  confirm_depth: 2
  batch_size: 50
  max_pending_hours: 24
  use_eip1559: true
  speed_up_gas_bump_percent: 20
  outbox_workers: 2
  require_idempotency_key: false
  reconcile_interval_sec: 10
  reconcile_grace_sec: 5
  broadcast_max_retries: 5

balance_sync:
  enabled: true
  custodial_only: true
  on_tx_confirmed: true
  on_indexer_tx: true
  stale_sec: 60
  backfill_interval_sec: 300
  watch_tokens: []
